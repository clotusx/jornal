/* ============================================================
   Generador de archivos .xlsx
   Un Excel es un ZIP con varios XML dentro, así que hace falta
   escribir el ZIP a mano (método «store», sin comprimir). Se replica
   el formato de la hoja «Horas curro»: tres columnas, Arial 10,
   cabecera de día en azul y casilla de total en verde agua.
   ============================================================ */
const XLSX = (() => {
  const TABLA_CRC = (() => {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++){
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[i] = c >>> 0;
    }
    return t;
  })();
  function crc32(b){
    let c = 0xFFFFFFFF;
    for (let i = 0; i < b.length; i++) c = TABLA_CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  const utf8 = s => new TextEncoder().encode(s);

  /** ZIP sin compresión: suficiente para XML y evita implementar deflate. */
  function zip(archivos){
    const enc = archivos.map(a => ({ nombre: utf8(a.nombre), datos: utf8(a.datos) }));
    const trozos = [], central = [];
    let off = 0;
    const u16 = v => [v & 0xFF, (v >> 8) & 0xFF];
    const u32 = v => [v & 0xFF, (v >> 8) & 0xFF, (v >> 16) & 0xFF, (v >>> 24) & 0xFF];

    for (const f of enc){
      const crc = crc32(f.datos), n = f.datos.length;
      const cab = [].concat(
        u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
        u32(crc), u32(n), u32(n), u16(f.nombre.length), u16(0));
      trozos.push(new Uint8Array(cab), f.nombre, f.datos);
      central.push([].concat(
        u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
        u32(crc), u32(n), u32(n), u16(f.nombre.length),
        u16(0), u16(0), u16(0), u16(0), u32(0), u32(off)));
      off += cab.length + f.nombre.length + n;
    }
    const dirIni = off;
    let dirLen = 0;
    for (let i = 0; i < central.length; i++){
      trozos.push(new Uint8Array(central[i]), enc[i].nombre);
      dirLen += central[i].length + enc[i].nombre.length;
    }
    trozos.push(new Uint8Array([].concat(
      u32(0x06054b50), u16(0), u16(0), u16(enc.length), u16(enc.length),
      u32(dirLen), u32(dirIni), u16(0))));

    const total = trozos.reduce((s,t) => s + t.length, 0);
    const salida = new Uint8Array(total);
    let p = 0;
    for (const t of trozos){ salida.set(t, p); p += t.length; }
    return salida;
  }

  const esc = s => String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&apos;")
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"");

  /* Estilos calcados de «Horas curro» */
  const ESTILOS = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="5">
<font><sz val="10"/><name val="Arial"/></font>
<font><sz val="10"/><name val="Arial"/><b/><color rgb="FFFFFFFF"/></font>
<font><sz val="10"/><name val="Arial"/><b/></font>
<font><sz val="14"/><name val="Arial"/><b/></font>
<font><sz val="10"/><name val="Arial"/><color rgb="FF666666"/></font>
</fonts>
<fills count="5">
<fill><patternFill patternType="none"/></fill>
<fill><patternFill patternType="gray125"/></fill>
<fill><patternFill patternType="solid"><fgColor rgb="FF4A86E8"/><bgColor indexed="64"/></patternFill></fill>
<fill><patternFill patternType="solid"><fgColor rgb="FFC9DAF8"/><bgColor indexed="64"/></patternFill></fill>
<fill><patternFill patternType="solid"><fgColor rgb="FFD0E0E3"/><bgColor indexed="64"/></patternFill></fill>
</fills>
<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="7">
<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center"/></xf>
<xf numFmtId="0" fontId="0" fillId="3" borderId="0" xfId="0" applyFill="1" applyAlignment="1"><alignment horizontal="center"/></xf>
<xf numFmtId="0" fontId="2" fillId="4" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center"/></xf>
<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/>
<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>
<xf numFmtId="0" fontId="4" fillId="0" borderId="0" xfId="0" applyFont="1"/>
</cellXfs>
</styleSheet>`;

  const COL = c => { let s = ""; c++; while (c > 0){ const r = (c-1) % 26; s = String.fromCharCode(65+r) + s; c = (c-1-r)/26; } return s; };

  /** hojas: [{ nombre, filas:[[{v,s,num}|null,...],...] }] */
  function crear(hojas){
    const partes = [];
    partes.push({ nombre:"[Content_Types].xml", datos:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
${hojas.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}
</Types>` });

    partes.push({ nombre:"_rels/.rels", datos:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>` });

    partes.push({ nombre:"xl/workbook.xml", datos:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${hojas.map((h,i)=>`<sheet name="${esc(h.nombre).slice(0,31)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets>
</workbook>` });

    partes.push({ nombre:"xl/_rels/workbook.xml.rels", datos:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${hojas.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}
<Relationship Id="rId${hojas.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>` });

    partes.push({ nombre:"xl/styles.xml", datos: ESTILOS });

    hojas.forEach((h,i) => {
      const filas = h.filas.map((f,ri) => {
        const celdas = f.map((c,ci) => {
          if (c == null) return "";
          const ref = COL(ci) + (ri+1), st = c.s ? ` s="${c.s}"` : "";
          if (c.num) return `<c r="${ref}"${st}><v>${c.v}</v></c>`;
          if (c.v === "" || c.v == null) return `<c r="${ref}"${st}/>`;
          return `<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${esc(c.v)}</t></is></c>`;
        }).join("");
        return celdas ? `<row r="${ri+1}">${celdas}</row>` : "";
      }).join("");
      partes.push({ nombre:`xl/worksheets/sheet${i+1}.xml`, datos:
        `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<cols><col min="1" max="1" width="13.13" customWidth="1"/><col min="2" max="2" width="6.75" customWidth="1"/><col min="3" max="3" width="7.5" customWidth="1"/></cols>
<sheetData>${filas}</sheetData>
</worksheet>` });
    });

    return new Blob([zip(partes)],
      { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  }
  return { crear };
})();

/** Construye el libro con el mismo aspecto que «Horas curro»: una hoja por semana. */
function libroHoras(d){
  const S_CAB = 1, S_FILA = 2, S_TOT = 3, S_TIT = 4, S_NEG = 5, S_GRIS = 6;
  const T = (v,s,num) => ({ v, s, num });
  const hojas = [];

  // Agrupar las jornadas por semana
  const semanas = new Map();
  d.dias.forEach(c => {
    const l = lunes(c.fecha);
    if (!semanas.has(l)) semanas.set(l, []);
    semanas.get(l).push(c);
  });

  for (const [lun, dias] of [...semanas.entries()].sort()){
    const filas = [];
    const fin = addDias(lun, 6);
    filas.push([T(`${fmtCorta(lun)} - ${fmtCorta(fin)}`, S_TIT)]);
    if (S.perfil.nombre) filas.push([T(S.perfil.nombre, S_NEG)]);
    if (EXP.descanso)
      filas.push([T(`Total = horas trabajadas menos ${num(S.config.descansoDia)} h de descanso`, S_GRIS)]);
    filas.push([]);

    dias.sort((a,b) => a.fecha < b.fecha ? -1 : 1).forEach(c => {
      const dia = DIAS[dow(c.fecha)];
      filas.push([ T(dia.charAt(0).toUpperCase() + dia.slice(1), S_CAB), T("Horas", S_CAB), T("Total", S_CAB) ]);
      const partes = c.partes.length ? c.partes : [{ obra: TIPOS[c.tipo].n, horas: c.horasAus || 0 }];
      partes.forEach((p,i) => {
        filas.push([
          T(p.obra, S_FILA),
          T(p.horas, S_FILA, true),
          i === 0 ? T(horasInforme(c), S_TOT, true) : T("", S_TOT)
        ]);
      });
      // Espacio en blanco entre días, como en la hoja original
      filas.push([T("", S_FILA), T("", S_FILA), T("", S_TOT)]);
      filas.push([]);
    });

    const totSem = redondea(dias.reduce((s,c) => s + horasInforme(c), 0));
    filas.push([ T("TOTAL SEMANA", S_CAB), T("", S_CAB), T(totSem, S_CAB, true) ]);

    const nom = `${fmtCorta(lun)}-${fmtCorta(fin)}`.replace(/[\\\/\?\*\[\]:]/g,"");
    hojas.push({ nombre: nom, filas });
  }

  // Hoja final con el resumen por obra
  if (EXP.porObra && d.obras.length){
    const filas = [];
    filas.push([T("Horas por obra", S_TIT)]);
    filas.push([T(etiquetaRango(d.desde, d.hasta), S_GRIS)]);
    filas.push([]);
    filas.push([T("Obra", S_CAB), T("Jorn.", S_CAB), T("Horas", S_CAB)]);
    d.obras.forEach(o => filas.push([T(o.nombre, S_FILA), T(o.dias, S_FILA, true), T(o.horas, S_TOT, true)]));
    filas.push([T("TOTAL", S_CAB), T(d.diasTrab, S_CAB, true), T(d.horas, S_CAB, true)]);
    if (EXP.importes){
      filas.push([]);
      filas.push([T("Horas extra", S_NEG), T(d.extraPagada, null, true)]);
      filas.push([T("Importe extra", S_NEG), T(d.importe, null, true)]);
    }
    hojas.push({ nombre:"Por obra", filas });
  }
  return XLSX.crear(hojas);
}

function exportarExcel(){
  const d = datosRango(expDesde, expHasta);
  if (!d.dias.length){ toast("No hay jornadas en ese periodo"); return; }
  try{
    const blob = libroHoras(d);
    const nom = `horas-${S.perfil.nombre ? S.perfil.nombre.split(" ")[0].toLowerCase()+"-" : ""}${expDesde}_${expHasta}.xlsx`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nom;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
    cerrarSheet();
    toast("Excel descargado con el formato de tu hoja");
  } catch(e){ apuntarError("excel", e); toast("No se ha podido generar el Excel"); }
}

/* ---------- CSV ---------- */
function exportarCSV(){
  const d = datosRango(expDesde, expHasta);
  const F = [];
  F.push(["INFORME DE HORAS"]);
  F.push(["Trabajador", S.perfil.nombre || ""]);
  if (S.perfil.empresa) F.push(["Empresa", S.perfil.empresa]);
  F.push(["Periodo", etiquetaRango(expDesde, expHasta)]);
  F.push(["Desde", expDesde, "Hasta", expHasta]);
  F.push(["Generado", new Date().toLocaleDateString("es-ES")]);
  F.push([]);

  F.push(["RESUMEN"]);
  F.push(["Días trabajados", d.diasTrab]);
  if (EXP.descanso){
    F.push(["Horas trabajadas", num(d.horas)]);
    F.push([`Descanso descontado (${num(S.config.descansoDia)} h/día)`, "-" + num(d.descanso)]);
    F.push(["HORAS A COMPUTAR", num(d.netas)]);
  } else {
    F.push(["Horas totales", num(d.horas)]);
  }
  F.push(["Horas ordinarias", num(d.ordinarias)]);
  F.push(["Horas extra", num(d.extraPagada)]);
  if (EXP.importes) F.push(["Importe de las horas extra", num(d.importe)]);
  Object.entries(d.ausencias).forEach(([k,v]) => F.push([TIPOS[k].n, v + (v===1?" día":" días")]));
  F.push([]);

  if (EXP.porObra && d.obras.length){
    F.push(["HORAS POR OBRA"]);
    F.push(["Obra","Jornadas","Horas"]);
    d.obras.forEach(o => F.push([o.nombre, o.dias, num(o.horas)]));
    F.push(["", "TOTAL", num(d.obras.reduce((s,o)=>s+o.horas,0))]);
    F.push([]);
  }

  if (EXP.detalle){
    F.push(["DETALLE POR JORNADA"]);
    const cab = ["Fecha","Día","Tipo","Obra","Horas"];
    if (EXP.descanso) cab.push("Trabajadas","Descanso","Total a computar");
    else cab.push("Total del día");
    cab.push("Horas extra");
    if (EXP.importes) cab.push("Importe extra");
    cab.push("Nota");
    F.push(cab);
    d.dias.forEach(c => {
      const nota = (S.dias[c.fecha]||{}).nota || "";
      const filas = c.partes.length ? c.partes : [null];
      filas.forEach((p,i) => {
        const f = [c.fecha, DIAS[dow(c.fecha)], TIPOS[c.tipo].n,
                   p ? p.obra : "", p ? num(p.horas) : ""];
        if (EXP.descanso)
          f.push(i===0 ? num(c.horas) : "", i===0 && c.descanso ? "-" + num(c.descanso) : "",
                 i===0 ? num(c.netas) : "");
        else f.push(i===0 ? num(c.horas) : "");
        f.push(i===0 ? num(c.extraPagada) : "");
        if (EXP.importes) f.push(i===0 ? num(c.importe) : "");
        f.push(i===0 ? nota : "");
        F.push(f);
      });
    });
  }

  const csv = "﻿" + F.map(f => f.map(c => `"${String(c ?? "").replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const nom = `horas-${S.perfil.nombre ? S.perfil.nombre.split(" ")[0].toLowerCase()+"-" : ""}${expDesde}_${expHasta}.csv`;
  if (descarga(nom, csv, "text/csv;charset=utf-8")){ cerrarSheet(); toast("CSV descargado — se abre con Excel"); }
}

/* ============================================================
   Generador de PDF
   Un PDF es texto plano con objetos numerados y una tabla de
   referencias al final. Se usan las fuentes Helvetica estándar,
   que no hay que incrustar, y codificación WinAnsi, que cubre
   todos los acentos y la eñe del castellano.
   ============================================================ */
const PDF = (() => {
  const ANCHO = 595.28, ALTO = 841.89, M = 40;   // A4 vertical

  // Anchuras de Helvetica (por cada 1000 unidades) para calcular centrados
  const W = {};
  {
    const asc = "278 278 355 556 556 889 667 191 333 333 389 584 278 333 278 278 "+
      "556 556 556 556 556 556 556 556 556 556 278 278 584 584 584 556 1015 "+
      "667 667 722 722 667 611 778 722 278 500 667 556 833 722 778 667 778 722 667 611 722 667 944 667 667 611 "+
      "278 278 278 469 556 333 "+
      "556 556 500 556 556 278 556 556 222 222 500 222 833 556 556 556 556 333 500 278 556 500 722 500 500 500 "+
      "334 260 334 584";
    asc.split(" ").forEach((v,i) => W[32+i] = +v);
  }
  const anchoTexto = (s, tam) => {
    let t = 0;
    for (const ch of s){ const c = ch.codePointAt(0); t += (c < 127 ? (W[c] || 556) : 556); }
    return t * tam / 1000;
  };

  /* Unicode → WinAnsi (CP1252). El castellano cabe entero en Latin-1. */
  const ESPECIAL = { 0x20AC:0x80, 0x201A:0x82, 0x2026:0x85, 0x2018:0x91, 0x2019:0x92,
                     0x201C:0x93, 0x201D:0x94, 0x2022:0x95, 0x2013:0x96, 0x2014:0x97,
                     0x2212:0x2D, 0x00A0:0x20, 0x2010:0x2D, 0x2011:0x2D };
  function winAnsi(s){
    let o = "";
    for (const ch of String(s)){
      const c = ch.codePointAt(0);
      o += String.fromCharCode(c < 256 ? c : (ESPECIAL[c] || 0x3F));
    }
    return o;
  }
  const escapa = s => winAnsi(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");

  function nuevo(){
    const paginas = [];
    let ops = null;
    const api = {
      get y(){ return api._y; },
      set y(v){ api._y = v; },
      _y: 0,
      ANCHO, ALTO, M, anchoUtil: ANCHO - M*2,

      pagina(){ ops = []; paginas.push(ops); api._y = ALTO - M; return api; },
      /** ¿Cabe algo de `alto` puntos? Si no, salta de página. */
      sitio(alto){ if (api._y - alto < M){ api.pagina(); return true; } return false; },

      color(hex){
        const n = parseInt(hex.replace("#",""), 16);
        ops.push(`${(((n>>16)&255)/255).toFixed(3)} ${(((n>>8)&255)/255).toFixed(3)} ${((n&255)/255).toFixed(3)} rg`);
        return api;
      },
      rect(x, y, w, h, hex){ api.color(hex); ops.push(`${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`); return api; },
      linea(x1, y1, x2, y2, hex, grosor){
        const n = parseInt((hex||"#000000").replace("#",""), 16);
        ops.push(`${(((n>>16)&255)/255).toFixed(3)} ${(((n>>8)&255)/255).toFixed(3)} ${((n&255)/255).toFixed(3)} RG`);
        ops.push(`${(grosor||0.5)} w ${x1.toFixed(2)} ${y1.toFixed(2)} m ${x2.toFixed(2)} ${y2.toFixed(2)} l S`);
        return api;
      },
      /** al: "izq" | "centro" | "der" */
      texto(s, x, y, tam, opt){
        s = String(s == null ? "" : s);
        if (!s) return api;
        const o = opt || {};
        const fuente = o.negrita ? "F2" : "F1";
        let px = x;
        if (o.al === "centro") px = x - anchoTexto(s, tam)/2;
        else if (o.al === "der") px = x - anchoTexto(s, tam);
        api.color(o.color || "#000000");
        ops.push(`BT /${fuente} ${tam} Tf 1 0 0 1 ${px.toFixed(2)} ${y.toFixed(2)} Tm (${escapa(s)}) Tj ET`);
        return api;
      },

      blob(){
        const objetos = [];
        const idPag = i => 4 + i*2;           // cada página usa 2 objetos
        objetos[1] = `<</Type/Catalog/Pages 2 0 R>>`;
        objetos[2] = `<</Type/Pages/Kids[${paginas.map((_,i)=>`${idPag(i)} 0 R`).join(" ")}]/Count ${paginas.length}>>`;
        objetos[3] = `<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>`;
        const idBold = 4 + paginas.length*2;
        paginas.forEach((p, i) => {
          const flujo = p.join("\n");
          objetos[idPag(i)] =
            `<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${ANCHO} ${ALTO}]` +
            `/Resources<</Font<</F1 3 0 R/F2 ${idBold} 0 R>>>>/Contents ${idPag(i)+1} 0 R>>`;
          objetos[idPag(i)+1] = `<</Length ${flujo.length}>>\nstream\n${flujo}\nendstream`;
        });
        objetos[idBold] = `<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>`;

        let salida = "%PDF-1.4\n";
        const pos = [];
        for (let i = 1; i < objetos.length; i++){
          if (!objetos[i]) continue;
          pos[i] = salida.length;
          salida += `${i} 0 obj\n${objetos[i]}\nendobj\n`;
        }
        const inicioXref = salida.length;
        const n = objetos.length;
        salida += `xref\n0 ${n}\n0000000000 65535 f \n`;
        for (let i = 1; i < n; i++)
          salida += (pos[i] != null)
            ? `${String(pos[i]).padStart(10,"0")} 00000 n \n`
            : `0000000000 65535 f \n`;
        salida += `trailer\n<</Size ${n}/Root 1 0 R>>\nstartxref\n${inicioXref}\n%%EOF`;

        const bytes = new Uint8Array(salida.length);
        for (let i = 0; i < salida.length; i++) bytes[i] = salida.charCodeAt(i) & 0xFF;
        return new Blob([bytes], { type:"application/pdf" });
      }
    };
    return api.pagina();
  }
  return { nuevo };
})();

/** Dibuja el informe completo en un PDF y devuelve el Blob. */
function pdfInforme(d){
  const AZUL = "#4A86E8", CLARO = "#C9DAF8", VERDE = "#D0E0E3";
  const GRIS = "#6b635a", TINTA = "#1c1a17";
  const p = PDF.nuevo();
  const X = p.M, ANCHO_UTIL = p.anchoUtil;

  // --- Cabecera ---
  p.texto("Informe de horas", X, p.y - 16, 17, { negrita:true, color:TINTA });
  const et = etiquetaRango(d.desde, d.hasta);
  p.texto(et.charAt(0).toUpperCase() + et.slice(1), X, p.y - 30, 10, { color:GRIS });
  const dcha = X + ANCHO_UTIL;
  if (S.perfil.nombre) p.texto(S.perfil.nombre, dcha, p.y - 14, 10, { al:"der", negrita:true, color:TINTA });
  if (S.perfil.empresa) p.texto(S.perfil.empresa, dcha, p.y - 26, 9.5, { al:"der", color:GRIS });
  p.texto(`${d.desde.split("-").reverse().join("/")} - ${d.hasta.split("-").reverse().join("/")}`,
          dcha, p.y - 38, 8.5, { al:"der", color:GRIS });
  p.y -= 46;
  p.linea(X, p.y, dcha, p.y, TINTA, 1.5);
  p.y -= 20;

  // --- Resumen ---
  const filas = [["Días trabajados", String(d.diasTrab)]];
  if (EXP.descanso){
    filas.push(["Horas trabajadas", num(d.horas) + " h"]);
    filas.push([`Descanso descontado (${num(S.config.descansoDia)} h × ${d.diasTrab} días)`, "− " + num(d.descanso) + " h"]);
    filas.push(["HORAS A COMPUTAR", num(d.netas) + " h"]);
  } else {
    filas.push(["Horas totales", num(d.horas) + " h"]);
  }
  filas.push(["De ellas, ordinarias", num(d.ordinarias) + " h"]);
  filas.push(["Horas extra", num(d.extraPagada) + " h"]);
  if (EXP.importes) filas.push(["Importe de las horas extra", eur(d.importe)]);
  Object.entries(d.ausencias).forEach(([k,v]) => filas.push([TIPOS[k].n, v + (v===1?" día":" días")]));

  filas.forEach(([a,b], i) => {
    p.sitio(16);
    p.texto(a, X, p.y, 10, { color:TINTA });
    p.texto(b, dcha, p.y, 10, { al:"der", negrita:true, color:TINTA });
    p.linea(X, p.y - 4, dcha, p.y - 4, "#e8e2d6", 0.5);
    p.y -= 16;
  });
  p.y -= 12;

  // --- Horas por obra ---
  if (EXP.porObra && d.obras.length){
    p.sitio(60);
    p.texto("HORAS POR OBRA", X, p.y, 9, { negrita:true, color:"#8A6A4A" });
    p.y -= 15;
    const cJ = X + 330, cH = X + 430;
    p.rect(X, p.y - 4, ANCHO_UTIL, 16, AZUL);
    p.texto("Obra", X + 6, p.y, 9, { negrita:true, color:"#FFFFFF" });
    p.texto("Jornadas", cJ, p.y, 9, { al:"centro", negrita:true, color:"#FFFFFF" });
    p.texto("Horas", cH, p.y, 9, { al:"centro", negrita:true, color:"#FFFFFF" });
    p.y -= 18;
    d.obras.forEach((o, i) => {
      if (p.sitio(18)) p.y -= 6;
      if (i % 2 === 0) p.rect(X, p.y - 4, ANCHO_UTIL, 15, "#f4f7fd");
      p.texto(o.nombre, X + 6, p.y, 9.5, { color:TINTA });
      p.texto(String(o.dias), cJ, p.y, 9.5, { al:"centro", color:TINTA });
      p.texto(num(o.horas), cH, p.y, 9.5, { al:"centro", negrita:true, color:TINTA });
      p.y -= 15;
    });
    p.sitio(20);
    p.rect(X, p.y - 4, ANCHO_UTIL, 16, VERDE);
    p.texto("TOTAL", X + 6, p.y, 9.5, { negrita:true, color:TINTA });
    p.texto(String(d.diasTrab), cJ, p.y, 9.5, { al:"centro", negrita:true, color:TINTA });
    p.texto(num(d.horas), cH, p.y, 9.5, { al:"centro", negrita:true, color:TINTA });
    p.y -= 30;
  }

  // --- Bloques por día, con la maqueta de la hoja de siempre ---
  if (EXP.detalle && d.dias.length){
    const semanas = new Map();
    d.dias.forEach(c => {
      const l = lunes(c.fecha);
      if (!semanas.has(l)) semanas.set(l, []);
      semanas.get(l).push(c);
    });
    const BW = 165, GAP = 10, FILA = 14;
    const cObra = 93, cHoras = 36, cTotal = 36;

    for (const [lun, dias] of [...semanas.entries()].sort()){
      p.sitio(70);
      p.texto(`${fmtCorta(lun)} - ${fmtCorta(addDias(lun,6))}`.toUpperCase(), X, p.y, 9,
              { negrita:true, color:"#8A6A4A" });
      p.y -= 16;

      const orden = dias.slice().sort((a,b) => a.fecha < b.fecha ? -1 : 1);
      const partesDe = c => c.partes.length ? c.partes : [{ obra:TIPOS[c.tipo].n, horas:c.horasAus||0 }];

      // Se dibujan de tres en tres, todos alineados por arriba
      for (let i = 0; i < orden.length; i += 3){
        const grupo = orden.slice(i, i + 3);
        const altoFila = FILA * (1 + Math.max(...grupo.map(c => partesDe(c).length)));
        p.sitio(altoFila + 10);
        const yTop = p.y;

        grupo.forEach((c, col) => {
          const bx = X + col * (BW + GAP);
          const partes = partesDe(c);
          let by = yTop;

          p.rect(bx, by - FILA + 4, BW, FILA, AZUL);
          const dia = DIAS[dow(c.fecha)];
          p.texto(dia.charAt(0).toUpperCase() + dia.slice(1), bx + 5, by - 6, 8.5, { negrita:true, color:"#FFFFFF" });
          p.texto("Horas", bx + cObra + cHoras/2, by - 6, 8.5, { al:"centro", negrita:true, color:"#FFFFFF" });
          p.texto("Total", bx + cObra + cHoras + cTotal/2, by - 6, 8.5, { al:"centro", negrita:true, color:"#FFFFFF" });
          by -= FILA;

          // Casilla del total: una sola, tan alta como las filas del día
          p.rect(bx + cObra + cHoras, by - FILA*partes.length + 4, cTotal, FILA*partes.length, VERDE);
          p.texto(num(horasInforme(c)), bx + cObra + cHoras + cTotal/2, by - 6, 8.5, { al:"centro", negrita:true, color:TINTA });

          partes.forEach(pa => {
            p.rect(bx, by - FILA + 4, cObra + cHoras, FILA, CLARO);
            let nom = String(pa.obra);
            if (anchoTextoAprox(nom, 8.5) > cObra - 10){
              while (nom.length > 3 && anchoTextoAprox(nom + "…", 8.5) > cObra - 10) nom = nom.slice(0, -1);
              nom += "…";
            }
            p.texto(nom, bx + 5, by - 6, 8.5, { color:TINTA });
            p.texto(num(pa.horas), bx + cObra + cHoras/2, by - 6, 8.5, { al:"centro", color:TINTA });
            by -= FILA;
          });
        });
        p.y = yTop - altoFila - 8;
      }

      // Total de la semana
      const tot = redondea(dias.reduce((s,c) => s + horasInforme(c), 0));
      p.sitio(24);
      p.rect(X, p.y - FILA + 4, BW, FILA, AZUL);
      p.texto("Total semana", X + 5, p.y - 6, 8.5, { negrita:true, color:"#FFFFFF" });
      p.texto(num(tot), X + cObra + cHoras + cTotal/2, p.y - 6, 8.5, { al:"centro", negrita:true, color:"#FFFFFF" });
      p.y -= 34;
    }
  }

  // --- Pie ---
  p.sitio(30);
  p.linea(X, p.y + 4, dcha, p.y + 4, "#ded7c8", 0.5);
  p.texto(`Generado con Jornal el ${new Date().toLocaleDateString("es-ES")}` +
          (EXP.descanso ? ` · Los totales llevan descontadas ${num(S.config.descansoDia)} h de descanso por día` : "") +
          (EXP.importes ? "" : " · Sin importes económicos"),
          X + ANCHO_UTIL/2, p.y - 8, 8, { al:"centro", color:"#8a8177" });

  return p.blob();
}
/* Ancho aproximado para recortar nombres largos de obra */
function anchoTextoAprox(s, tam){ return String(s).length * tam * 0.52; }

function nombrePDF(){
  const quien = (S.perfil.nombre||"").trim().split(" ")[0].toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
  return `horas-${quien ? quien+"-" : ""}${expDesde}_${expHasta}.pdf`;
}

/** Compartir el PDF por WhatsApp, correo, etc. Si no se puede, se descarga. */
async function compartirPDF(){
  const d = datosRango(expDesde, expHasta);
  if (!d.dias.length){ toast("No hay jornadas en ese periodo"); return; }
  let blob;
  try { blob = pdfInforme(d); }
  catch(e){ apuntarError("pdf", e); toast("No se ha podido generar el PDF"); return; }

  const archivo = new File([blob], nombrePDF(), { type:"application/pdf" });
  try{
    if (navigator.canShare && navigator.canShare({ files:[archivo] })){
      await navigator.share({
        files: [archivo],
        title: "Informe de horas",
        text: `Horas de ${etiquetaRango(expDesde, expHasta)}` +
              (S.perfil.nombre ? ` · ${S.perfil.nombre}` : "")
      });
      cerrarSheet();
      return;
    }
  } catch(e){
    if (e && e.name === "AbortError") return;      // el usuario ha cancelado
    apuntarError("compartir-pdf", e);
  }
  descargarPDF(blob);
}
function descargarPDF(blob){
  const d = blob || (() => { try { return pdfInforme(datosRango(expDesde, expHasta)); } catch(e){ apuntarError("pdf", e); return null; } })();
  if (!d) { toast("No se ha podido generar el PDF"); return; }
  const url = URL.createObjectURL(d);
  const a = document.createElement("a");
  a.href = url; a.download = nombrePDF();
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
  cerrarSheet();
  toast("PDF descargado");
}

/* ============================================================
   Copias de seguridad en archivo
   Tres vías, se usa la mejor que permita el dispositivo:
   1. Carpeta elegida (ordenador): escritura automática, sin preguntar nada.
   2. Hoja de compartir (móvil): un toque y «Guardar en Archivos». iOS y Android
      recuerdan la última carpeta usada, así que a partir de la 2ª vez ya se abre
      directamente en «Copias de seguridad Jornal».
   3. Descarga normal, como respaldo.
   Ningún sistema operativo móvil permite que una web escriba sola en el
   almacenamiento del usuario, así que la vía 1 es exclusiva de escritorio.
   ============================================================ */
const KEY_DIR = "carpeta-copias";
let dirCopias = null;

const soportaCarpeta = () => typeof window.showDirectoryPicker === "function";
function nombreCopia(){
  const quien = (S.perfil.nombre || "").trim().split(" ")[0]
    .toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
  return `jornal-${hoyISO()}${quien ? "-" + quien : ""}.json`;
}
async function cargarCarpeta(){
  try { dirCopias = (await idbGet(KEY_DIR)) || null; }
  catch(e){ dirCopias = null; }
}
async function permisoCarpeta(pedir){
  if (!dirCopias || !dirCopias.queryPermission) return false;
  try{
    const opt = { mode:"readwrite" };
    if (await dirCopias.queryPermission(opt) === "granted") return true;
    if (pedir && await dirCopias.requestPermission(opt) === "granted") return true;
  } catch(e){ apuntarError("permiso-carpeta", e); }
  return false;
}
async function elegirCarpeta(){
  if (!soportaCarpeta()){ toast("Este navegador no permite elegir carpeta"); return; }
  try{
    const padre = await window.showDirectoryPicker({ mode:"readwrite", startIn:"documents", id:"jornal-copias" });
    dirCopias = await padre.getDirectoryHandle(CARPETA_COPIAS, { create:true });
    await idbPut(KEY_DIR, dirCopias);
    await escribirEnCarpeta();
    render();
    toast(`Carpeta lista. Las copias se guardarán solas en «${CARPETA_COPIAS}»`);
  } catch(e){
    if (e && e.name === "AbortError") return;      // el usuario ha cancelado
    apuntarError("elegir-carpeta", e);
    toast("No se ha podido preparar la carpeta");
  }
}
async function olvidarCarpeta(){
  const ok = await confirmar("¿Dejar de usar esa carpeta?",
    "Jornal dejará de guardar las copias solo. Los archivos ya guardados no se tocan.",
    "Sí, olvidarla", true);
  if (!ok) return;
  dirCopias = null;
  try { await idbPut(KEY_DIR, null); } catch(e){}
  render(); toast("Carpeta olvidada");
}
async function escribirEnCarpeta(){
  if (!dirCopias) return false;
  if (!(await permisoCarpeta(true))) return false;
  try{
    const fh = await dirCopias.getFileHandle(nombreCopia(), { create:true });
    const w = await fh.createWritable();
    await w.write(JSON.stringify(S));
    await w.close();
    S.ultimoBackup = hoyISO();
    await guardar();
    return true;
  } catch(e){ apuntarError("escribir-carpeta", e); return false; }
}

/** Guardar copia. `auto`=true cuando la lanza la propia app (sin toque del usuario). */
async function descargarBackup(auto){
  const nombre = nombreCopia(), texto = JSON.stringify(S);

  // 1) Carpeta ya autorizada: se escribe sola, sin ninguna pregunta
  if (dirCopias){
    if (await escribirEnCarpeta()){
      render();
      if (!auto) toast(`Guardada en «${CARPETA_COPIAS}»`);
      return true;
    }
  }
  // Las llamadas automáticas no pueden abrir la hoja de compartir: los
  // navegadores solo lo permiten como respuesta a un toque.
  if (auto) return false;

  // 2) Móvil: hoja de compartir → «Guardar en Archivos»
  try{
    const file = new File([texto], nombre, { type:"application/json" });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:"Copia de seguridad de Jornal" });
      S.ultimoBackup = hoyISO(); await guardar(); render();
      toast("Copia guardada");
      return true;
    }
  } catch(e){
    if (e && e.name === "AbortError") return false;   // el usuario ha cancelado
    apuntarError("compartir-copia", e);
  }
  // 3) Descarga normal
  if (!descarga(nombre, texto, "application/json")) return false;
  S.ultimoBackup = hoyISO(); await guardar(); render();
  toast(soportaCarpeta() ? "Copia descargada" : "Guárdala en Archivos o Drive");
  return true;
}

function pedirRestaurar(){ $("#fileIn").click(); }
function restaurar(input){
  const f = input.files && input.files[0];
  input.value = "";
  if (!f) return;
  if (f.size > 25*1024*1024){ toast("El archivo es demasiado grande"); return; }
  const fr = new FileReader();
  fr.onerror = () => { apuntarError("leer-archivo", fr.error); toast("No se ha podido leer el archivo"); };
  fr.onload = async () => {
    try{
      const d = JSON.parse(fr.result);
      if (!d || typeof d !== "object" || typeof d.dias !== "object") throw new Error("formato");
      const n = Object.keys(d.dias).length;
      const ok = await confirmar("¿Restaurar esta copia?",
        `Contiene ${n} jornadas y sustituirá por completo las ${Object.keys(S.dias).length} que tienes ahora. No se puede deshacer.`,
        "Sí, restaurar", true);
      if (!ok) return;
      S = {...estadoNuevo(), ...d,
           config:{...CFG_DEF, ...(d.config||{})},
           perfil:{nombre:"",empresa:"", ...(d.perfil||{})},
           nominas: d.nominas||{}, obras: Array.isArray(d.obras)?d.obras:[],
           onboarded:true};
      invalidar(); await guardar(); render(); toast(`Restauradas ${n} jornadas`);
    } catch(e){ apuntarError("restaurar", e); toast("El archivo no es una copia válida de Jornal"); }
  };
  fr.readAsText(f);
}

    "Sí, borrar todo", true);
  if (!dos) return;
  S = estadoNuevo(); invalidar(); await guardar();
  onbPaso = 0; onbDatos = {...CFG_DEF};

}
/* ============================================================
   Actualizaciones
   El service worker descarga la versión nueva pero NO la aplica. La app avisa
   con un botón; al pulsarlo se guarda una copia de seguridad local y solo
   entonces se activa. Los datos viven en IndexedDB, aparte de la caché de la
   app, así que una actualización nunca los toca.
   ============================================================ */
let swReg = null, swEsperando = null, recargando = false;

function hayActualizacion(){ return !!swEsperando; }

async function aplicarActualizacion(){
  if (!swEsperando) return;
  const btn = document.querySelector('[data-acc="actualizar"]');
  if (btn){ btn.textContent = "Guardando copia…"; btn.disabled = true; }

  // 1) Copia de seguridad ANTES de tocar nada
  const ok = await snapshotAhora("antes de actualizar a " + APP_VER);
  if (!ok){
    const seguir = await confirmar("No se ha podido guardar la copia",
      "¿Quieres actualizar igualmente? Tus datos están guardados aparte y no deberían verse afectados.",
      "Actualizar igualmente", true);
    if (!seguir){ if (btn){ btn.textContent = "Actualizar"; btn.disabled = false; } return; }
  }
  // 2) Dejar constancia de desde qué versión venimos, para enseñar las novedades
  try { localStorage.setItem("jornal:ver-anterior", S.verVista || "0"); } catch(_){}
  if (btn) btn.textContent = "Actualizando…";

  // 3) Pedir al service worker que active la versión nueva
  swEsperando.postMessage({ tipo: "APLICAR_ACTUALIZACION" });
  setTimeout(() => { if (!recargando){ recargando = true; location.reload(); } }, 2500);
}

function vigilarActualizacion(reg){
  if (!reg) return;
  swReg = reg;
  const revisar = () => {
    if (reg.waiting && navigator.serviceWorker.controller){
      swEsperando = reg.waiting;
      mostrarAvisos();
    }
  };
  revisar();
  reg.addEventListener("updatefound", () => {
    const nw = reg.installing;
    if (!nw) return;
    nw.addEventListener("statechange", () => {
      if (nw.state === "installed" && navigator.serviceWorker.controller){
        swEsperando = reg.waiting || nw;
        mostrarAvisos();
        toast("Hay una versión nueva de Jornal");
      }
    });
  });
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (recargando) return;
    recargando = true;
    location.reload();
  });
  // Comprobar si hay novedades al abrir y cada media hora si se queda abierta
  const buscar = () => reg.update().catch(() => {});
  buscar();
  setInterval(buscar, 30*60*1000);
  window.addEventListener("focus", buscar);
}

async function buscarActualizacionManual(){
  if (!swReg){ toast("Las actualizaciones no están disponibles aquí"); return; }
  toast("Buscando actualizaciones…");
  try{
    await swReg.update();
    setTimeout(() => {
      if (hayActualizacion()) toast("¡Hay una versión nueva! Pulsa Actualizar");
      else toast("Ya tienes la última versión");
    }, 1200);
  } catch(e){ apuntarError("buscar-update", e); toast("No se ha podido comprobar"); }
}

/** Compara "1.10.0" vs "1.9.0" correctamente (no alfabéticamente) */
function cmpVer(a, b){
  const A = String(a||"0").split(".").map(Number), B = String(b||"0").split(".").map(Number);
  for (let i=0;i<Math.max(A.length,B.length);i++){
    const x = A[i]||0, y = B[i]||0;
    if (x !== y) return x > y ? 1 : -1;
  }
  return 0;
}

async function comprobarPersistencia(){

        let ok = await navigator.storage.persisted();
        if (!ok) ok = await navigator.storage.persist();
        el.textContent = ok ? "sí" : "no garantizado";
        el.style.color = ok ? "var(--ok)" : "var(--warn)";
      } else el.textContent = "no soportado";

         config:{...CFG_DEF, ...(guardado.config||{})},

  } else {

  }

  vSemana = lunes(hoyISO()); vMes = mesDe(hoyISO()); vFecha = hoyISO();

    if (dirCopias && ultB && diasEntre(ultB, hoyISO()) >= 7 && Object.keys(S.dias).length)
      descargarBackup(true).then(ok => { if (ok) toast(`Copia semanal guardada en «${CARPETA_COPIAS}»`); });
    // ¿Venimos de una actualización? Enseñar qué ha cambiado.
    const vista = S.verVista || "0";
    if (cmpVer(APP_VER, vista) > 0){
      S.verVista = APP_VER;
      guardar();
      if (vista !== "0") setTimeout(() => mostrarNovedades(vista), 900);
    }
  } else {
    onbDatos = {...CFG_DEF, ...onbDatos};

    b.addEventListener("click", () => {
      tab = b.dataset.t; render();
      if (tab === "ajustes") setTimeout(comprobarPersistencia, 50);

  if (navigator.storage && navigator.storage.persist)
    navigator.storage.persist().catch(()=>{});
}

    navigator.serviceWorker.register("sw.js")
      .then(vigilarActualizacion)
      .catch(e => console.warn("SW no registrado:", e));
  });
}
</script>
